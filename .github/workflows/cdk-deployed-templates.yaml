name: CDK Deployed Templates
# Reusable workflow - the TRUSTED half of a credential-isolated CDK preview.
#
# Fetches the deployed CloudFormation templates of named stacks with a read-only role and uploads them
# as an artifact. A separate job WITHOUT credentials then synthesizes the pull request's code and runs
# `cdk diff --template <deployed>.json`, so pull request code never runs where credentials exist.
#
# Security invariants (keep them when changing this file):
# - No checkout and no download of caller artifacts or caches: nothing from the caller's repository
#   or pull request runs or is read here. Only the runner image's AWS CLI and jq, and the pinned
#   actions below, execute.
# - Caller inputs are validated before use and passed to commands through environment variables.
# - The role is expected to trust this workflow by `job_workflow_ref` pinned to a full commit SHA, and
#   to allow only `cloudformation:GetTemplate` on an allowlist of stacks. IAM is the authoritative
#   allowlist; the stack-name check here only rejects malformed input early.
on:
  workflow_call:
    inputs:
      roleArn:
        description: "ARN of the read-only role to assume through GitHub OIDC"
        required: true
        type: string
      awsRegion:
        description: "AWS region of the stacks"
        required: false
        default: "us-east-1"
        type: string
      stackNames:
        description: 'JSON array of deployed stack names, e.g. ["my-app-dev","my-app-dns"] (at most 20)'
        required: true
        type: string
      artifactName:
        description: "Name of the uploaded artifact holding <stack>.json files"
        required: false
        default: "cdk-deployed-templates"
        type: string
    outputs:
      artifactName:
        description: "Name of the uploaded artifact"
        value: ${{ inputs.artifactName }}

permissions:
  id-token: write

jobs:
  fetch:
    name: deployed templates
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Validate inputs
        env:
          ROLE_ARN: ${{ inputs.roleArn }}
          AWS_REGION_INPUT: ${{ inputs.awsRegion }}
          STACK_NAMES: ${{ inputs.stackNames }}
          ARTIFACT_NAME: ${{ inputs.artifactName }}
        run: |
          set -euo pipefail
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,64}$ ]] || { echo "::error::roleArn is not an IAM role ARN."; exit 1; }
          [[ "$AWS_REGION_INPUT" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || { echo "::error::awsRegion is not an AWS region."; exit 1; }
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::artifactName may contain only letters, digits, '.', '_' and '-'."; exit 1; }
          jq -e 'type == "array" and length >= 1 and length <= 20 and (map(type == "string") | all) and (unique | length) == length' <<<"$STACK_NAMES" >/dev/null \
            || { echo "::error::stackNames must be a JSON array of 1-20 distinct strings."; exit 1; }
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z][A-Za-z0-9-]{0,127}$ ]] || { echo "::error::Invalid CloudFormation stack name: $name"; exit 1; }
          done < <(jq -r '.[]' <<<"$STACK_NAMES")
          jq -r '.[]' <<<"$STACK_NAMES" > "$RUNNER_TEMP/stack-names.txt"

      - name: Assume read-only role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.roleArn }}
          aws-region: ${{ inputs.awsRegion }}
          audience: sts.amazonaws.com
          role-session-name: cdk-templates-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: Fetch deployed templates
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deployed-templates"
          mkdir -p "$out"
          while IFS= read -r name; do
            # Original stage: the template as submitted. GetTemplate never resolves dynamic
            # references, Fn::GetAtt values, or NoEcho parameters.
            if ! aws cloudformation get-template \
              --stack-name "$name" \
              --template-stage Original \
              --query TemplateBody \
              --output json > "$out/$name.raw.json"; then
              echo "::error::Could not read the deployed template of $name."
              exit 1
            fi
            # TemplateBody is a JSON object for JSON templates and a string for YAML templates.
            if jq -e 'type == "object"' "$out/$name.raw.json" >/dev/null; then
              jq . "$out/$name.raw.json" > "$out/$name.json"
            else
              echo "::error::Stack $name has a non-JSON template; only CDK-synthesized JSON templates are supported."
              exit 1
            fi
            rm "$out/$name.raw.json"
            echo "Fetched $name ($(wc -c < "$out/$name.json") bytes)"
          done < "$RUNNER_TEMP/stack-names.txt"

      - name: Upload deployed templates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ runner.temp }}/deployed-templates/*.json
          if-no-files-found: error
          retention-days: 1
