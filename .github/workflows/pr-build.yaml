name: PR Build
# Reusable workflow - called by consumer repos on pull_request events.
#
# v11: credential-free and least-privilege. Jobs run with read-only repository contents and never
# request AWS or OIDC credentials, so they are safe to run on untrusted pull request code. Callers
# need only `contents: read`. CDK synth/diff moved to a dedicated workflow.
on:
  workflow_call:
    inputs:
      webPath:
        description: "Path to the Blazor WebAssembly project"
        required: false
        type: string
      spaSites:
        description: "JSON array of JavaScript SPAs to build (npm ci + npm run build). Supports optional per-SPA env vars with dev/prod values. e.g. [{\"name\":\"docs\",\"path\":\"apps/docs\",\"env\":{\"NEXT_PUBLIC_SITE_URL\":{\"dev\":\"https://dev.example.com\",\"prod\":\"https://www.example.com\"}}}]"
        required: false
        type: string
        default: '[]'
      solution:
        description: "Solution file name"
        required: false
        type: string
      buildPlatform:
        description: "Build platform"
        required: false
        default: "Any CPU"
        type: string
      buildConfiguration:
        description: "Build configuration"
        required: false
        default: "release"
        type: string
      dotnetVersion:
        description: ".NET SDK version(s) for actions/setup-dotnet, e.g. 11.x or a multi-line list. Leave empty to use globalJsonFile (or a repository-root global.json)."
        required: false
        default: ""
        type: string
      globalJsonFile:
        description: "Optional path to a global.json used by actions/setup-dotnet to select the SDK. Can be combined with dotnetVersion."
        required: false
        default: ""
        type: string
      dotnetFormat:
        description: "Run dotnet format --verify-no-changes against the solution"
        required: false
        default: false
        type: boolean
      lambdaRuntimeVersion:
        description: "AWS Lambda runtime version"
        required: false
        default: "net9.0"
        type: string
      nodeVersion:
        description: "Node version for Node.js jobs (ignored when nodeVersionFile is set)"
        required: false
        default: "lts/*"
        type: string
      nodeVersionFile:
        description: "Optional path to a Node version file (.nvmrc, .node-version, package.json) for Node.js jobs"
        required: false
        default: ""
        type: string
      packageManager:
        description: "Package manager to use for Node.js projects (npm or pnpm)"
        required: false
        default: "npm"
        type: string
      pnpmVersion:
        description: "pnpm version to install. Leave empty to use the packageManager field of each project's package.json (only used when packageManager is pnpm)"
        required: false
        default: ""
        type: string
      nodeProjects:
        description: "JSON array of Node.js projects to validate, one check per project. e.g. [{\"name\":\"web\",\"path\":\"app\",\"scripts\":[\"lint\",\"typecheck\",\"test\",\"build\"],\"env\":{\"NEXT_TELEMETRY_DISABLED\":\"1\"}}]. env values must not be secrets."
        required: false
        type: string
        default: '[]'
      outputPath:
        description: "Output directory for builds"
        required: false
        default: "publish"
        type: string
      hasTests: # ✅ New input to control test execution
        description: "Determines if tests should be run"
        required: false
        default: false
        type: boolean
      useMtpRunner: # ✅ New input to control MTP runner usage
        description: "Use Microsoft Testing Platform runner (dotnet run) instead of legacy dotnet test"
        required: false
        default: false
        type: boolean
      enableCodeCoverage: # ✅ New input to enable code coverage
        description: "Enable code coverage collection"
        required: false
        default: false
        type: boolean
      coverageThreshold: # ✅ New input for coverage threshold
        description: "Minimum code coverage percentage required (0-100)"
        required: false
        default: 80
        type: number
      coverageReportFormats:
        description: "Coverage report format for legacy runner (cobertura, opencover, lcov). Must be cobertura for the coverage summary step to work. MTP runner always uses cobertura."
        required: false
        default: "cobertura"
        type: string
      coverageSettingsPath:
        description: "Optional code coverage settings file path (used with MTP runner via --coverage-settings)."
        required: false
        default: ""
        type: string
      runCdk:
        description: "Deprecated in v11 and must be false: CDK no longer runs in this credential-free workflow. Use the dedicated CDK workflow instead."
        required: false
        default: false
        type: boolean
      stackName:
        description: "Deprecated in v11; ignored. Retained so existing callers upgrade without unexpected-input errors."
        required: false
        type: string
      functions:
        description: "JSON array of Lambda functions to build"
        required: false
        type: string
        default: '[]'  # e.g. [{"path": "src/Foo", "name": "foo-func"}, {"path": "src/Bar", "name": "bar-func"}]

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (inputs.solution != '' || inputs.webPath != '' || inputs.hasTests || inputs.functions != '[]')
    runs-on: ${{ inputs.lambdaRuntimeVersion == 'net11.0' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Reject removed CDK execution
        if: inputs.runCdk
        run: |
          echo "::error::pr-build v11 no longer runs AWS CDK. Set runCdk: false and use the dedicated CDK workflow; see the devops-templates README (v11 migration)."
          exit 1

      - name: Set Default Output Path If Not Provided
        # Not named outputPath: MSBuild reads environment variables as properties, and an `outputPath`
        # variable would redirect every project's OutputPath into this one folder.
        run: |
          if [ -z "${{ inputs.outputPath }}" ]; then
            echo "TEMPLATE_OUTPUT_PATH=${{ github.workspace }}/publish" >> $GITHUB_ENV
          else
            echo "TEMPLATE_OUTPUT_PATH=${{ github.workspace}}/${{ inputs.outputPath }}" >> $GITHUB_ENV
          fi

      - name: Validate .NET Inputs
        if: inputs.solution == ''
        run: |
          echo "❌ .NET steps are required but inputs.solution was not provided."
          echo "   Provide inputs.solution (e.g. MyApp.sln) when using webPath/hasTests/functions."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnetVersion }}
          global-json-file: ${{ inputs.globalJsonFile }}

      - name: Restore Dependencies
        run: dotnet restore ${{ inputs.solution }} -p:Configuration="${{ inputs.buildConfiguration }}"

      - name: Verify Formatting
        if: inputs.dotnetFormat
        run: dotnet format ${{ inputs.solution }} --verify-no-changes --no-restore

      - name: Build Code
        run: dotnet build ${{ inputs.solution }} --configuration "${{ inputs.buildConfiguration }}" --no-restore

      - name: Test Code
        if: inputs.hasTests == true && inputs.enableCodeCoverage == false
        run: |
          SOLUTION="${{ inputs.solution }}"
          SOLUTION_ARGS=()
          [ -n "$SOLUTION" ] && SOLUTION_ARGS+=(--solution "$SOLUTION")
          dotnet test "${SOLUTION_ARGS[@]}" --no-restore --configuration "${{ inputs.buildConfiguration }}"

      - name: Test Code with Legacy Coverage
        if: inputs.hasTests == true && inputs.useMtpRunner == false && inputs.enableCodeCoverage == true
        run: |
          SOLUTION="${{ inputs.solution }}"
          SOLUTION_ARGS=()
          [ -n "$SOLUTION" ] && SOLUTION_ARGS+=(--solution "$SOLUTION")
          dotnet test "${SOLUTION_ARGS[@]}" --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger trx \
            --configuration "${{ inputs.buildConfiguration }}" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=${{ inputs.coverageReportFormats }}

      - name: Test Code with MTP Coverage
        if: inputs.hasTests == true && inputs.useMtpRunner == true && inputs.enableCodeCoverage == true
        run: |
          SOLUTION="${{ inputs.solution }}"
          SOLUTION_ARGS=()
          [ -n "$SOLUTION" ] && SOLUTION_ARGS+=(--solution "$SOLUTION")
          COVERAGE_SETTINGS=""
          if [ -n "${{ inputs.coverageSettingsPath }}" ]; then
            COVERAGE_SETTINGS="--coverage-settings ${{ inputs.coverageSettingsPath }}"
          fi

          dotnet test "${SOLUTION_ARGS[@]}" --no-restore \
            --results-directory ./coverage \
            --configuration "${{ inputs.buildConfiguration }}" \
            --report-xunit-trx \
            --coverage \
            $COVERAGE_SETTINGS \
            --coverage-output ./coverage/coverage.cobertura.xml \
            --coverage-output-format cobertura

      - name: Code Coverage Summary
        if: inputs.hasTests == true && inputs.enableCodeCoverage == true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: ${{ inputs.coverageThreshold > 0 }}
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '${{ inputs.coverageThreshold }} 80'

      - name: Upload Coverage Reports
        if: inputs.hasTests == true && inputs.enableCodeCoverage == true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            ./coverage/**/*
            code-coverage-results.md
          retention-days: 30

      - name: Setup Local .NET Tools
        if: inputs.functions != '[]'
        run: |
          dotnet new tool-manifest --force
          dotnet tool install Amazon.Lambda.Tools

      - name: Build and Publish Blazor WebAssembly
        if: inputs.webPath != ''
        run: dotnet publish ${{ inputs.webPath }} --configuration "${{ inputs.buildConfiguration }}" --no-restore --output ${{ env.TEMPLATE_OUTPUT_PATH }}

      - name: Detect Lambda custom build images
        id: lambda-custom-container
        if: inputs.functions != '[]'
        shell: bash
        run: |
          FUNCTIONS='${{ inputs.functions }}'
          for i in $(seq 0 $(( $(echo "$FUNCTIONS" | jq length) - 1 ))); do
            PATH_VALUE=$(echo "$FUNCTIONS" | jq -r ".[$i].path")
            DEFAULTS_FILE="$PATH_VALUE/aws-lambda-tools-defaults.json"
            if [ -f "$DEFAULTS_FILE" ] && [ -n "$(jq -r '."container-image-for-build" // empty' "$DEFAULTS_FILE")" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Build Lambda Native AOT images
        id: lambda-native-aot
        if: steps.lambda-custom-container.outputs.enabled == 'true'
        uses: $/.github/actions/lambda-native-aot-package
        with:
          functions: ${{ inputs.functions }}
          configuration: ${{ inputs.buildConfiguration }}
          lambdaRuntimeVersion: ${{ inputs.lambdaRuntimeVersion }}
          outputPath: ${{ env.TEMPLATE_OUTPUT_PATH }}

      # Functions whose own aws-lambda-tools-defaults.json declares `container-image-for-build` were
      # already built and packaged by the step above, from an isolated checkout copy - see that
      # action's own comment for why packaging those in place here would be unsafe. This loop
      # handles everything else (the ordinary, non-container Lambda Tools path).
      - name: Build and Package All Lambda Functions
        if: inputs.functions != '[]'
        run: |
          FUNCTIONS='${{ inputs.functions }}'
          PACKAGED='${{ steps.lambda-native-aot.outputs.packaged-functions || '[]' }}'
          COUNT=$(echo "$FUNCTIONS" | jq length)
          for i in $(seq 0 $((COUNT - 1))); do
            NAME=$(echo "$FUNCTIONS" | jq -r ".[$i].name")
            FUNC_PATH=$(echo "$FUNCTIONS" | jq -r ".[$i].path")
            if echo "$PACKAGED" | jq -e --arg n "$NAME" 'index($n) != null' >/dev/null; then
              echo "Skipping $NAME - already packaged by the Native AOT isolated-build step"
              continue
            fi
            ZIP_PATH="${{ env.TEMPLATE_OUTPUT_PATH }}/${NAME}.zip"
            dotnet tool run dotnet-lambda package -pl "$FUNC_PATH" --configuration "${{ inputs.buildConfiguration }}" --no-restore --framework ${{ inputs.lambdaRuntimeVersion }} --output-package "$ZIP_PATH"
          done

  node:
    name: node (${{ matrix.project.name }})
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      inputs.nodeProjects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.nodeProjects) }}

    steps:
      - name: Reject removed CDK execution
        if: inputs.runCdk
        run: |
          echo "::error::pr-build v11 no longer runs AWS CDK. Set runCdk: false and use the dedicated CDK workflow; see the devops-templates README (v11 migration)."
          exit 1

      - name: Validate Node.js project
        env:
          PROJECT: ${{ toJSON(matrix.project) }}
          PACKAGE_MANAGER: ${{ inputs.packageManager }}
        run: |
          set -euo pipefail
          for field in name path; do
            if [ -z "$(jq -r --arg f "$field" '.[$f] // empty' <<<"$PROJECT")" ]; then
              echo "::error::nodeProjects entries require '$field'."
              exit 1
            fi
          done
          if [ "$(jq '.scripts | length' <<<"$PROJECT")" -eq 0 ]; then
            echo "::error::nodeProjects entries require a non-empty 'scripts' array."
            exit 1
          fi
          case "$PACKAGE_MANAGER" in
            npm) lockfile=package-lock.json ;;
            pnpm) lockfile=pnpm-lock.yaml ;;
            *) echo "::error::packageManager must be npm or pnpm."; exit 1 ;;
          esac
          echo "LOCKFILE=$(jq -r '.path' <<<"$PROJECT")/$lockfile" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm (explicit version)
        if: inputs.packageManager == 'pnpm' && inputs.pnpmVersion != ''
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpmVersion }}

      - name: Setup pnpm (packageManager field)
        if: inputs.packageManager == 'pnpm' && inputs.pnpmVersion == ''
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.project.path }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.nodeVersionFile == '' && inputs.nodeVersion || '' }}
          node-version-file: ${{ inputs.nodeVersionFile }}
          cache: ${{ inputs.packageManager }}
          cache-dependency-path: ${{ env.LOCKFILE }}

      - name: Install Dependencies
        working-directory: ${{ matrix.project.path }}
        env:
          PACKAGE_MANAGER: ${{ inputs.packageManager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run Scripts
        working-directory: ${{ matrix.project.path }}
        env:
          PROJECT: ${{ toJSON(matrix.project) }}
          PACKAGE_MANAGER: ${{ inputs.packageManager }}
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::Invalid env var name in nodeProjects env: $key"
              exit 1
            fi
            export "$key=$(jq -r --arg k "$key" '.env[$k]' <<<"$PROJECT")"
          done < <(jq -r '.env // {} | keys[]' <<<"$PROJECT")

          while IFS= read -r script; do
            echo "::group::$PACKAGE_MANAGER run $script"
            "$PACKAGE_MANAGER" run "$script"
            echo "::endgroup::"
          done < <(jq -r '.scripts[]' <<<"$PROJECT")

  spa:
    name: spa
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      inputs.spaSites != '[]'
    runs-on: ubuntu-latest

    steps:
      - name: Reject removed CDK execution
        if: inputs.runCdk
        run: |
          echo "::error::pr-build v11 no longer runs AWS CDK. Set runCdk: false and use the dedicated CDK workflow; see the devops-templates README (v11 migration)."
          exit 1

      - name: Set Default Output Path If Not Provided
        # Not named outputPath: MSBuild reads environment variables as properties, and an `outputPath`
        # variable would redirect every project's OutputPath into this one folder.
        run: |
          if [ -z "${{ inputs.outputPath }}" ]; then
            echo "TEMPLATE_OUTPUT_PATH=${{ github.workspace }}/publish" >> $GITHUB_ENV
          else
            echo "TEMPLATE_OUTPUT_PATH=${{ github.workspace}}/${{ inputs.outputPath }}" >> $GITHUB_ENV
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: inputs.packageManager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          # spaSites keeps its v10 default; nodeProjects can read each package.json packageManager field.
          version: ${{ inputs.pnpmVersion || '10' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.nodeVersionFile == '' && inputs.nodeVersion || '' }}
          node-version-file: ${{ inputs.nodeVersionFile }}

      - name: Build JavaScript SPAs
        if: inputs.spaSites != '[]'
        run: |
          set -euo pipefail

          SITES='${{ inputs.spaSites }}'
          COUNT=$(echo "$SITES" | jq length)

          if [ "$COUNT" -eq 0 ]; then
            echo "No SPAs configured."
            exit 0
          fi

          echo "Building $COUNT JavaScript SPA(s)..."

          for i in $(seq 0 $((COUNT - 1))); do
            NAME=$(echo "$SITES" | jq -r ".[$i].name // empty")
            SPA_PATH=$(echo "$SITES" | jq -r ".[$i].path // empty")
            BUILD_DIR=$(echo "$SITES" | jq -r ".[$i].buildDir // \"dist\"")
            INSTALL_CMD=$(echo "$SITES" | jq -r ".[$i].installCommand // \"npm ci\"")
            BUILD_CMD=$(echo "$SITES" | jq -r ".[$i].buildCommand // \"npm run build\"")
            OUTPUT_SUBDIR=$(echo "$SITES" | jq -r ".[$i].outputSubdir // empty")

            if [ -z "$NAME" ]; then
              echo "❌ spaSites[$i].name is required"
              exit 1
            fi
            if [ -z "$SPA_PATH" ]; then
              echo "❌ spaSites[$i].path is required (site: $NAME)"
              exit 1
            fi
            if [ ! -f "$SPA_PATH/package.json" ]; then
              echo "❌ package.json not found at $SPA_PATH (site: $NAME)"
              exit 1
            fi

            if [ -z "$OUTPUT_SUBDIR" ]; then
              OUTPUT_SUBDIR="websites/$NAME"
            fi

            echo "---"
            echo "Site: $NAME"
            echo "Path: $SPA_PATH"
            echo "Build dir: $BUILD_DIR"
            echo "Output subdir: $OUTPUT_SUBDIR"

            ENV_SPEC=$(echo "$SITES" | jq -c ".[$i].env // {}")
            ENV_KEYS=$(echo "$ENV_SPEC" | jq -r 'keys[]')
            ENV_KEYS_SET=()
            ENV_PREV_SET=()
            ENV_PREV_VAL=()
            if [ -n "$ENV_KEYS" ]; then
              echo "Env (dev):"
              for KEY in $ENV_KEYS; do
                if [[ ! "$KEY" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                  echo "❌ Invalid env var name in spaSites[$i].env: $KEY (site: $NAME)"
                  exit 1
                fi

                RAW_VAL=$(echo "$ENV_SPEC" | jq -r --arg k "$KEY" '.[ $k ] | if type=="object" then (.dev) else . end')
                if [ "$RAW_VAL" = "null" ]; then
                  echo "❌ Missing spaSites[$i].env.$KEY.dev value (site: $NAME)"
                  exit 1
                fi
                VAL=$(printf "%s" "$RAW_VAL")
                if [ -z "$VAL" ]; then
                  echo "❌ Missing spaSites[$i].env.$KEY.dev value (site: $NAME)"
                  exit 1
                fi

                if [ "${!KEY+x}" ]; then
                  ENV_PREV_SET+=("1")
                  ENV_PREV_VAL+=("${!KEY}")
                else
                  ENV_PREV_SET+=("0")
                  ENV_PREV_VAL+=("")
                fi
                ENV_KEYS_SET+=("$KEY")
                export "$KEY=$VAL"
                echo "- $KEY=***"
              done
            fi

            echo "Installing deps: $INSTALL_CMD"
            (cd "$SPA_PATH" && bash -lc "$INSTALL_CMD")

            echo "Building: $BUILD_CMD"
            (cd "$SPA_PATH" && bash -lc "$BUILD_CMD")

            BUILD_OUT="$SPA_PATH/$BUILD_DIR"
            if [ ! -d "$BUILD_OUT" ]; then
              echo "❌ Build output directory not found: $BUILD_OUT (site: $NAME)"
              exit 1
            fi

            SITE_OUT="${{ env.TEMPLATE_OUTPUT_PATH }}/$OUTPUT_SUBDIR"
            rm -rf "$SITE_OUT"
            mkdir -p "$SITE_OUT"
            cp -a "$BUILD_OUT/." "$SITE_OUT/"

            echo "✅ Built $NAME -> $SITE_OUT"

            if [ ${#ENV_KEYS_SET[@]} -gt 0 ]; then
              for IDX in "${!ENV_KEYS_SET[@]}"; do
                KEY="${ENV_KEYS_SET[$IDX]}"
                if [ "${ENV_PREV_SET[$IDX]}" = "1" ]; then
                  export "$KEY=${ENV_PREV_VAL[$IDX]}"
                else
                  unset "$KEY"
                fi
              done
            fi
          done
